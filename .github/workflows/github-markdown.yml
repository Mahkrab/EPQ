name: Github Markdown checks

on:
  pull_request:
    branches:
      - main
      - documentation
      - "milestone/**"
      - "phase/**"
  push:
    branches:
      - main
      - documentation
      - "milestone/**"
      - "phase/**"
  merge_group:

permissions:
  contents: read

jobs:
  github-markdown:
    name: Check Github Markdown rendering
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest tests.markdown.test

      - name: Check whitespace errors
        run: git diff --check

      - name: Check changed documentation through GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tests/markdown/check.py
          docs/project/development/milestones/00/explanations/math.md
          docs/project/development/milestones/00/phases/phase-00-design-contract.md
