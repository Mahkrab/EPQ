name: Milestone asset policy

on:
  pull_request:
    branches:
      - main
      - documentation
      - "milestone/**"
  push:
    branches:
      - main
      - documentation
      - "milestone/**"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milestone-assets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  milestone-assets:
    name: Check milestone assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check repository assets
        run: python3 -B tests/evidence/checks/assets.py
