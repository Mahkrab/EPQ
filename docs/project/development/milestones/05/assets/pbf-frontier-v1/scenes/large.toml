schema_version = 2
name = "frontier-large"
description = "Isolated fixed-geometry PBF policy experiment"
randomness = "none"

[configuration]
source = "file"
path = "../config/large.toml"

[container]
min_m = [0.0, 0.0, 0.0]
max_m = [2.8, 3.0, 2.8]

[particles]
construction = "groups"

[[particles.groups]]
name = "group-0"
construction = "lattice"
origin_m = [0.2, 0.4, 0.2]
counts = [48, 48, 48]
endpoint_rule = "counted_half_open"
order = "x_then_y_then_z"
initial_velocity_m_s = [0, 0, 0]
