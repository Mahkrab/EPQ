schema_version = 2
name = "frontier-shear"
description = "Isolated fixed-geometry PBF policy experiment"
randomness = "none"

[configuration]
source = "file"
path = "../config/shear.toml"

[container]
min_m = [0.0, 0.0, 0.0]
max_m = [3.0, 3.0, 3.0]

[particles]
construction = "groups"

