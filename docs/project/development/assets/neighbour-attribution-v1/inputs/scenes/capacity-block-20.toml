schema_version = 1
name = "capacity-block-20"
description = "Counted 20-by-20-by-20 diagnostic fluid block"
randomness = "none"
allow_coincident_particles = false

[configuration]
source = "file"
path = "../config/defaults-v4.toml"

[particles]
construction = "lattice"
first_identity = 0
origin_m = [0.2, 0.4, 0.2]
counts = [20, 20, 20]
spacing_m = 0.05
endpoint_rule = "counted_half_open"
order = "x_then_y_then_z"
initial_velocity_m_s = [0.0, 0.0, 0.0]

[[planes]]
normal = [1.0, 0.0, 0.0]
offset_m = 0.0

[[planes]]
normal = [-1.0, 0.0, 0.0]
offset_m = -1.40

[[planes]]
normal = [0.0, 1.0, 0.0]
offset_m = 0.0

[[planes]]
normal = [0.0, -1.0, 0.0]
offset_m = -1.60

[[planes]]
normal = [0.0, 0.0, 1.0]
offset_m = 0.0

[[planes]]
normal = [0.0, 0.0, -1.0]
offset_m = -1.40
